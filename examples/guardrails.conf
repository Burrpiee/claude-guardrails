# .claude/guardrails.conf -- how this project is guarded. Commit this file.
# Machine-specific values (memory, ports, smoke, worktree_links) go in
# .claude/guardrails.local.conf beside it, which git should ignore. A key
# read once (memory, backlog, agent_launch_guard) takes the local file's
# value; every other key adds up across both files.
#
# Lines are `key = value`; a key may repeat; lines starting with # are
# comments. Relative paths are relative to the repo root.

# Ask before a command that deploys or spends. Four fields split on `::`:
#   <runs> :: <requires> :: <forbids> :: <the reason shown>
# <runs> is a regex matched where the command runs (not inside an echo or a
# grep pattern); every part of <requires> (split on " && ") must appear;
# <forbids> must not.
# guard = (npm run deploy|terraform apply) :: :: :: This deploys to production.
# guard = my-tool[^|;&]*import :: --all :: --dry-run :: import --all reads every file (~$40). Try --dry-run.

# Other repos this one works with: their guards apply here, and the session
# status reports their branches.
# partners = ../other-repo

# The decision log and backlog the owed check and handoff skill read.
# `decisions` may repeat, and may name a folder of decision records (every
# .md in it but README.md and index files). Unset, it is docs/DECISIONS.md
# and docs/decisions/, each when present.
# decisions = docs/DECISIONS.md
# decisions = docs/decisions
# backlog = docs/BACKLOG.md

# Instruction files that load every session, and a word budget each.
# words = CLAUDE.md 1500

# Refuse to launch an agent until MEMORY.md is fresh and its prompt is saved
# in a file (off unless set).
# agent_launch_guard = on

# --- usually in guardrails.local.conf ---
# The memory folder (default: Claude Code's own for this repo).
# memory = ~/.claude/projects/<key>/memory
# Dev servers whose ports the session status reports.
# ports = 5173 8000
# Run once in each review worktree (guardrails-review-worktree).
# smoke = npm test
# Git-ignored folders linked into each review worktree (too big to copy).
# Small ignored files, such as a .env, are copied instead: list them in the
# repo's .worktreeinclude, the file Claude Code reads for its own worktrees.
# worktree_links = node_modules
