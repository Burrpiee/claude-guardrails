name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install jq if missing
        run: |
          command -v jq && exit 0
          case "$RUNNER_OS" in
            macOS)   brew install jq ;;
            Windows) choco install jq -y ;;
            *)       sudo apt-get install -y jq ;;
          esac
      - name: Tests
        if: runner.os != 'macOS'
        run: bash tests/run.sh
      - name: Tests under macOS's own bash 3.2
        if: runner.os == 'macOS'
        run: PATH="$PWD/tests/shim:$PATH" GUARDRAILS_EXPECT_BASH=3 /bin/bash tests/run.sh
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate --strict .
      - name: The claude word guard's list against the real claude --help
        run: GUARDRAILS_REAL_CLAUDE="$(command -v claude)" bash tests/run.sh tests/test-word.sh
